<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Planning, Orchestration, and Agentic Review</title><desc id="desc">An orchestrator assigns parallel and sequential workstreams, agents create pull requests, automated tests and independent agent reviews repeat until a human approves.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker><style>.t{font-family:Arial,sans-serif;fill:#101828}.h{font-size:43px;font-weight:700}.s{font-size:22px;font-weight:700}.n{font-size:18px}.ai{fill:#edf9ee;stroke:#2e8b3c;stroke-width:3}.human{fill:#e8f1ff;stroke:#1769d2;stroke-width:4}.art{fill:#fff7df;stroke:#d48b00;stroke-width:3}.work{fill:#f4f0ff;stroke:#7f56d9;stroke-width:3}.infra{fill:#f8fafc;stroke:#667085;stroke-width:3}.line{fill:none;stroke:#344054;stroke-width:3;marker-end:url(#a)}.dash{stroke-dasharray:10 8}</style></defs><rect width="1600" height="900" fill="white"/><text class="t h" x="800" y="60" text-anchor="middle">Planning, Orchestration, and Agentic Review</text>
<rect class="art" x="45" y="365" width="210" height="95" rx="16"/><text class="t s" x="150" y="402" text-anchor="middle">Approved plan</text><text class="t n" x="150" y="433" text-anchor="middle">First-class artifact</text>
<rect class="ai" x="305" y="335" width="250" height="155" rx="18"/><text class="t s" x="430" y="380" text-anchor="middle">Orchestrator agent</text><text class="t n" x="430" y="414" text-anchor="middle">Decompose, assign,</text><text class="t n" x="430" y="442" text-anchor="middle">coordinate and monitor</text><path class="line" d="M255 412H305"/>
<rect x="605" y="105" width="600" height="285" rx="22" fill="white" stroke="#7f56d9" stroke-width="3" stroke-dasharray="10 8"/><text class="t s" x="905" y="145" text-anchor="middle">Parallel workstreams</text>
<g><rect class="work" x="640" y="180" width="155" height="80" rx="14"/><text class="t n" x="718" y="213" text-anchor="middle">Coding agent A</text><text class="t n" x="718" y="240" text-anchor="middle">Area A</text><rect class="infra" x="640" y="285" width="155" height="65" rx="14"/><text class="t n" x="718" y="326" text-anchor="middle">Branch + PR A</text></g>
<g><rect class="work" x="825" y="180" width="155" height="80" rx="14"/><text class="t n" x="903" y="213" text-anchor="middle">Coding agent B</text><text class="t n" x="903" y="240" text-anchor="middle">Area B</text><rect class="infra" x="825" y="285" width="155" height="65" rx="14"/><text class="t n" x="903" y="326" text-anchor="middle">Branch + PR B</text></g>
<g><rect class="work" x="1010" y="180" width="155" height="80" rx="14"/><text class="t n" x="1088" y="213" text-anchor="middle">Coding agent N</text><text class="t n" x="1088" y="240" text-anchor="middle">Area N</text><rect class="infra" x="1010" y="285" width="155" height="65" rx="14"/><text class="t n" x="1088" y="326" text-anchor="middle">Branch + PR N</text></g>
<path class="line" d="M718 260V285"/><path class="line" d="M903 260V285"/><path class="line" d="M1088 260V285"/><path class="line" d="M555 385H580V220H640"/><path class="line" d="M555 405H590V220H825"/><path class="line" d="M555 425H600V220H1010"/>
<rect x="605" y="475" width="600" height="245" rx="22" fill="white" stroke="#1769d2" stroke-width="3" stroke-dasharray="10 8"/><text class="t s" x="905" y="515" text-anchor="middle">Sequential PR stack</text>
<rect class="work" x="650" y="565" width="145" height="85" rx="14"/><text class="t n" x="723" y="600" text-anchor="middle">Agent 1</text><text class="t n" x="723" y="628" text-anchor="middle">Foundation</text><rect class="work" x="835" y="565" width="145" height="85" rx="14"/><text class="t n" x="908" y="600" text-anchor="middle">Agent 2</text><text class="t n" x="908" y="628" text-anchor="middle">Depends on 1</text><rect class="work" x="1020" y="565" width="145" height="85" rx="14"/><text class="t n" x="1093" y="600" text-anchor="middle">Agent N</text><text class="t n" x="1093" y="628" text-anchor="middle">Depends on N−1</text><path class="line" d="M795 607H835"/><path class="line" d="M980 607H1020"/><path class="line" d="M555 450H585V607H650"/>
<rect class="ai" x="1245" y="170" width="285" height="100" rx="18"/><text class="t s" x="1388" y="210" text-anchor="middle">Automated tests</text><text class="t n" x="1388" y="242" text-anchor="middle">Unit · integration · browser · security</text>
<rect class="ai" x="1245" y="340" width="285" height="100" rx="18"/><text class="t s" x="1388" y="380" text-anchor="middle">Independent review</text><text class="t n" x="1388" y="412" text-anchor="middle">Find issues and comment</text>
<rect class="ai" x="1245" y="510" width="285" height="100" rx="18"/><text class="t s" x="1388" y="550" text-anchor="middle">Coding agent</text><text class="t n" x="1388" y="582" text-anchor="middle">Fix comments and push</text>
