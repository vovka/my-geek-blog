<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cost Estimation Framework</title><desc id="desc">Fixed, role-based model, variable execution, and human oversight costs combine into cost per accepted feature or active day.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker><style>.t{font-family:Arial,sans-serif;fill:#101828}.h{font-size:43px;font-weight:700}.s{font-size:21px;font-weight:700}.n{font-size:17px}.fixed{fill:#e8f1ff;stroke:#1769d2;stroke-width:3}.role{fill:#f4f0ff;stroke:#7f56d9;stroke-width:3}.var{fill:#edf9ee;stroke:#2e8b3c;stroke-width:3}.human{fill:#e8f1ff;stroke:#1769d2;stroke-width:3}.total{fill:#101828;stroke:#101828;stroke-width:4}.note{fill:#fff7df;stroke:#d48b00;stroke-width:3}.line{fill:none;stroke:#667085;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="white"/><text class="t h" x="800" y="60" text-anchor="middle">Cost Estimation Framework for an AI Software Factory</text>
<text class="t s" x="280" y="125" text-anchor="middle">Fixed and semi-fixed costs</text><g transform="translate(70 155)"><rect class="fixed" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Workspace / enterprise seats</text></g><g transform="translate(70 255)"><rect class="fixed" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Harness and platform maintenance</text></g><g transform="translate(70 355)"><rect class="fixed" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Tooling subscriptions</text></g><g transform="translate(70 455)"><rect class="fixed" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Storage and logging baseline</text></g>
<text class="t s" x="800" y="125" text-anchor="middle">Role-based model usage</text><g transform="translate(590 155)"><rect class="role" width="420" height="78" rx="15"/><text class="t n" x="210" y="32" text-anchor="middle">Orchestrator model</text><text class="t n" x="210" y="56" text-anchor="middle">Planning · decomposition · routing</text></g><g transform="translate(590 255)"><rect class="role" width="420" height="78" rx="15"/><text class="t n" x="210" y="32" text-anchor="middle">Coding models</text><text class="t n" x="210" y="56" text-anchor="middle">Implementation · debugging</text></g><g transform="translate(590 355)"><rect class="role" width="420" height="78" rx="15"/><text class="t n" x="210" y="32" text-anchor="middle">Review models</text><text class="t n" x="210" y="56" text-anchor="middle">Quality · security · architecture</text></g><g transform="translate(590 455)"><rect class="role" width="420" height="78" rx="15"/><text class="t n" x="210" y="32" text-anchor="middle">Transcription model</text><text class="t n" x="210" y="56" text-anchor="middle">Per audio minute or local compute</text></g>
<text class="t s" x="1320" y="125" text-anchor="middle">Variable per-feature costs</text><g transform="translate(1110 155)"><rect class="var" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Fresh input · cached input · output tokens</text></g><g transform="translate(1110 255)"><rect class="var" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Coding and review agent runs</text></g><g transform="translate(1110 355)"><rect class="var" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Tests · browser sessions · CI minutes</text></g><g transform="translate(1110 455)"><rect class="var" width="420" height="78" rx="15"/><text class="t n" x="210" y="47" text-anchor="middle">Temporary environments · storage · observability</text></g>
<rect class="human" x="260" y="620" width="440" height="90" rx="18"/><text class="t s" x="480" y="655" text-anchor="middle">Human oversight</text><text class="t n" x="480" y="687" text-anchor="middle">Architecture · review · acceptance · release</text>
<rect class="total" x="825" y="600" width="520" height="130" rx="22"/><text x="1085" y="653" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">ESTIMATED COST</text><text x="1085" y="693" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">PER ACCEPTED FEATURE / DAY</text>
<path class="line" d="M280 533V570H930V600"/><path class="line" d="M800 533V575H1010V600"/><path class="line" d="M1320 533V575H1240V600"/><path class="line" d="M700 665H825"/>
<rect class="note" x="430" y="790" width="740" height="75" rx="18"/><text class="t s" x="800" y="822" text-anchor="middle">Use current provider prices and measured usage.</text><text class="t n" x="800" y="850" text-anchor="middle">Optimize cost per accepted feature, not cost per token.</text><path class="line" d="M1085 730V790"/>
</svg>
