<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Development Harness and Pluggable Abstractions</title><desc id="desc">A stable organizational harness governs replaceable services and agents such as transcription, planning, coding, review, project management, source control, CI/CD, automation, deployment, and observability.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#101828}.h{font-size:43px;font-weight:700}.s{font-size:21px;font-weight:700}.n{font-size:16px}.hbox{fill:#e8f1ff;stroke:#1769d2;stroke-width:3}.abox{fill:#edf9ee;stroke:#2e8b3c;stroke-width:3}.core{fill:#fff7df;stroke:#d48b00;stroke-width:3}.dash{fill:white;stroke:#2e8b3c;stroke-width:3;stroke-dasharray:10 8}.line{fill:none;stroke:#667085;stroke-width:3}</style></defs><rect width="1600" height="900" fill="white"/><text class="t h" x="800" y="60" text-anchor="middle">Development Harness and Pluggable Abstractions</text>
<rect x="60" y="105" width="1480" height="260" rx="24" fill="white" stroke="#1769d2" stroke-width="5"/><text class="t s" x="800" y="145" text-anchor="middle">Development harness — stable organizational layer</text>
<g><rect class="hbox" x="95" y="190" width="210" height="105" rx="16"/><text class="t s" x="200" y="230" text-anchor="middle">Constitutions</text><text class="t n" x="200" y="260" text-anchor="middle">Principles and rules</text></g><g><rect class="hbox" x="335" y="190" width="210" height="105" rx="16"/><text class="t s" x="440" y="230" text-anchor="middle">Guardrails</text><text class="t n" x="440" y="260" text-anchor="middle">Constraints and policy</text></g><g><rect class="hbox" x="575" y="190" width="210" height="105" rx="16"/><text class="t s" x="680" y="230" text-anchor="middle">Skills</text><text class="t n" x="680" y="260" text-anchor="middle">Reusable capabilities</text></g><g><rect class="hbox" x="815" y="190" width="210" height="105" rx="16"/><text class="t s" x="920" y="230" text-anchor="middle">Hooks</text><text class="t n" x="920" y="260" text-anchor="middle">Automation and checks</text></g><g><rect class="hbox" x="1055" y="190" width="210" height="105" rx="16"/><text class="t s" x="1160" y="230" text-anchor="middle">Permissions</text><text class="t n" x="1160" y="260" text-anchor="middle">Access boundaries</text></g><g><rect class="hbox" x="1295" y="190" width="210" height="105" rx="16"/><text class="t s" x="1400" y="230" text-anchor="middle">Knowledge</text><text class="t n" x="1400" y="260" text-anchor="middle">Architecture and context</text></g>
<rect class="core" x="470" y="395" width="660" height="75" rx="18"/><text class="t s" x="800" y="442" text-anchor="middle">All agents and integrations operate through the harness</text><path class="line" d="M200 295V345H800V395M440 295V345M680 295V395M920 295V395M1160 295V345M1400 295V345H800"/>
<rect class="dash" x="60" y="510" width="1480" height="330" rx="24"/><text class="t s" x="800" y="550" text-anchor="middle">Replaceable abstractions — examples are illustrative, not prescriptive</text>
<g transform="translate(95 590)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Transcription service</text><text class="t n" x="130" y="63" text-anchor="middle">Local STT · cloud STT</text></g><g transform="translate(385 590)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Planning agent</text><text class="t n" x="130" y="63" text-anchor="middle">Claude · Codex · internal</text></g><g transform="translate(675 590)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Coding agent</text><text class="t n" x="130" y="63" text-anchor="middle">Claude Code · Codex · Copilot</text></g><g transform="translate(965 590)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Review agent</text><text class="t n" x="130" y="63" text-anchor="middle">Independent or custom model</text></g><g transform="translate(1255 590)"><rect class="abox" width="250" height="90" rx="15"/><text class="t s" x="125" y="34" text-anchor="middle">Project management</text><text class="t n" x="125" y="63" text-anchor="middle">Jira · Notion · Linear · Issues</text></g>
<g transform="translate(95 715)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Source control</text><text class="t n" x="130" y="63" text-anchor="middle">GitHub · GitLab · Bitbucket</text></g><g transform="translate(385 715)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">CI/CD platform</text><text class="t n" x="130" y="63" text-anchor="middle">Actions · GitLab CI · Jenkins</text></g><g transform="translate(675 715)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">UI automation</text><text class="t n" x="130" y="63" text-anchor="middle">Playwright · Selenium · OS tools</text></g><g transform="translate(965 715)"><rect class="abox" width="260" height="90" rx="15"/><text class="t s" x="130" y="34" text-anchor="middle">Deployment platform</text><text class="t n" x="130" y="63" text-anchor="middle">Cloud · Kubernetes · on-prem</text></g><g transform="translate(1255 715)"><rect class="abox" width="250" height="90" rx="15"/><text class="t s" x="125" y="34" text-anchor="middle">Observability</text><text class="t n" x="125" y="63" text-anchor="middle">Metrics · logs · traces</text></g>
<path class="line" d="M800 470V510"/>
</svg>
