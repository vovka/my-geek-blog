name: Insert AI SDLC diagrams

on:
  push:
    branches:
      - post/human-governed-ai-software-development-lifecycle
    paths:
      - .github/workflows/insert-ai-sdlc-diagrams.yml

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post/human-governed-ai-software-development-lifecycle

      - name: Insert diagram images into draft
        shell: python
        run: |
          from pathlib import Path

          path = Path("content/posts/human-governed-ai-software-development-lifecycle.draft.md")
          text = path.read_text()
          base = "/images/human-governed-ai-software-development-lifecycle"

          insertions = [
              (
                  "The following diagram shows the process at a high level. Blue nodes are explicit human checkpoints. Green nodes are AI-owned execution stages. Architecture mapping is prepared by AI but requires human approval before implementation proceeds.\n",
                  f"\n![Human-governed AI software development lifecycle]({base}/lifecycle-model.svg)\n",
              ),
              (
                  "Instead of rediscovering the architecture from the codebase for every new task, the team identifies which parts of the existing architecture must change.\n",
                  f"\n![Architecture baseline and proposed change]({base}/architecture-mapping.svg)\n",
              ),
              (
                  "The orchestration layer is also an abstraction. A company may use one strong model as a central orchestrator, allow engineers to launch agents manually, or use a custom internal service.\n",
                  f"\n![Planning, orchestration, and agentic review]({base}/planning-orchestration-agentic-review.svg)\n",
              ),
              (
                  "The harness is the combination of instructions, tools, skills, hooks, policies, templates, checks, and guardrails available to every agent.\n",
                  f"\n![Development harness and pluggable abstractions]({base}/development-harness-pluggable-abstractions.svg)\n",
              ),
              (
                  "The last item will usually remain the largest cost. Token cost matters, but the meaningful metric is not cost per token. It is **cost per accepted feature**.\n",
                  f"\n![Cost estimation framework for an AI software factory]({base}/cost-estimation-framework.svg)\n",
              ),
          ]

          for anchor, image in insertions:
              if image.strip() in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Missing article anchor: {anchor[:80]}")
              text = text.replace(anchor, anchor + image, 1)

          path.write_text(text)

      - name: Remove temporary upload fragments
        run: rm -rf .tmp/ai-sdlc-images

      - name: Commit article image references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/human-governed-ai-software-development-lifecycle.draft.md .tmp/ai-sdlc-images
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Insert generated diagrams into AI lifecycle draft"
          git push origin HEAD:post/human-governed-ai-software-development-lifecycle
